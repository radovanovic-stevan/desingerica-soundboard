<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desingerica Soundboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #141414;
    --yellow: #ffe500;
    --yellow-dim: #b3a000;
    --red: #ff2d2d;
    --white: #f5f5f5;
    --muted: #8a8a8a;
    --card: #1a1a1a;
    --card-hover: #222;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    padding: 0 16px 60px;
  }
  /* yellow-tape stripes */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      repeating-linear-gradient(-45deg, transparent 0 40px, rgba(255,229,0,.035) 40px 80px);
  }
  .tape {
    position: relative; z-index: 1;
    margin: 0 -16px;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 24px, #000 24px 48px);
    height: 14px;
  }

  header {
    position: relative; z-index: 1;
    text-align: center;
    padding: 44px 0 24px;
  }
  .eyebrow {
    display: inline-block;
    background: var(--yellow); color: #000;
    font-weight: 700; font-size: 12px; letter-spacing: .28em; text-transform: uppercase;
    padding: 6px 14px; transform: rotate(-2deg);
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'Anton', Impact, sans-serif;
    font-size: clamp(56px, 12vw, 140px);
    line-height: .9;
    letter-spacing: .01em;
    text-transform: uppercase;
    color: var(--white);
    text-shadow: 6px 6px 0 var(--red), 12px 12px 0 var(--yellow);
    -webkit-text-stroke: 1px #000;
  }
  h1 span { color: var(--yellow); text-shadow: 6px 6px 0 var(--red), 12px 12px 0 #fff; }
  .sub {
    margin-top: 18px; color: var(--muted); font-size: 15px; font-weight: 500;
    letter-spacing: .04em;
  }
  .sub b { color: var(--yellow); }

  .controls {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;
    padding: 12px 16px; margin: 10px -16px 26px;
    background: rgba(10,10,10,.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .ctl-btn {
    font-family: inherit; font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    background: transparent; color: var(--white);
    border: 2px solid var(--white); padding: 10px 18px; cursor: pointer;
    transition: all .15s;
  }
  .ctl-btn:hover { background: var(--white); color: #000; }
  .ctl-btn.danger { border-color: var(--red); color: var(--red); }
  .ctl-btn.danger:hover { background: var(--red); color: #fff; }
  .ctl-btn.yellow { border-color: var(--yellow); color: var(--yellow); }
  .ctl-btn.yellow:hover, .ctl-btn.yellow.active { background: var(--yellow); color: #000; }
  .vol { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
  .vol input { accent-color: var(--yellow); width: 120px; }
  .counter { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
  .counter b { color: var(--yellow); font-size: 16px; }

  .board {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
    max-width: 1280px; margin: 0 auto;
  }
  .pad {
    position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 150px;
    padding: 16px 16px 14px;
    background: var(--card);
    border: 2px solid var(--border);
    border-bottom-width: 6px;
    color: var(--white);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: transform .08s, border-color .15s, background .15s, box-shadow .15s;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .pad::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.04), transparent 60%);
    pointer-events: none;
  }
  .pad:hover { background: var(--card-hover); border-color: #444; transform: translateY(-2px); }
  .pad:active, .pad.playing {
    transform: translateY(4px);
    border-bottom-width: 2px;
    border-color: var(--yellow);
    background: #1f1c00;
    box-shadow: 0 0 0 2px var(--yellow), 0 0 30px rgba(255,229,0,.35);
  }
  .pad.playing .bar { transform: scaleX(1); }
  .pad .num {
    font-family: 'Anton', Impact, sans-serif;
    font-size: 13px; letter-spacing: .1em;
    color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  .pad .num .key {
    font-family: 'Space Grotesk', monospace; font-size: 10px; font-weight: 700;
    border: 1px solid #333; padding: 1px 6px; color: #666; border-radius: 3px;
  }
  .pad .quote {
    font-family: 'Anton', Impact, sans-serif;
    font-size: clamp(20px, 2.2vw, 26px);
    line-height: 1.05;
    text-transform: uppercase;
    margin: 12px 0 10px;
    color: var(--white);
    word-break: break-word;
  }
  .pad.playing .quote { color: var(--yellow); }
  .pad .song {
    font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--red);
  }
  .pad .bar {
    position: absolute; left: 0; bottom: 0; height: 4px; width: 100%;
    background: var(--yellow);
    transform: scaleX(0); transform-origin: left;
    transition: transform .1s linear;
  }
  .pad.pop { animation: pop .25s ease-out; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.04) rotate(-1deg); }
    100% { transform: scale(1); }
  }

  footer {
    position: relative; z-index: 1;
    text-align: center; margin-top: 50px; color: #555; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  }
  footer b { color: var(--yellow); }

  /* Floating ad-lib bubbles */
  .adlib {
    position: fixed; z-index: 50; pointer-events: none;
    font-family: 'Anton', Impact, sans-serif;
    font-size: clamp(28px, 6vw, 72px);
    color: var(--yellow);
    text-shadow: 4px 4px 0 var(--red);
    text-transform: uppercase;
    animation: fly 1.2s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes fly {
    0% { opacity: 0; transform: translate(-50%, 0) scale(.6) rotate(-6deg); }
    15% { opacity: 1; transform: translate(-50%, -20px) scale(1.1) rotate(3deg); }
    100% { opacity: 0; transform: translate(-50%, -160px) scale(1) rotate(-2deg); }
  }

  @media (max-width: 480px) {
    .board { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .pad { min-height: 130px; padding: 12px; }
    .pad .quote { font-size: 18px; }
    h1 { text-shadow: 3px 3px 0 var(--red), 6px 6px 0 var(--yellow); }
    .vol input { width: 90px; }
  }
</style>
</head>
<body>
<div class="tape"></div>
<header>
  <div class="eyebrow">Najjača firmetina · Soundboard</div>
  <h1>Desin<span>gerica</span></h1>
  <p class="sub">30 dugmića. Klikni, ili kucaj <b>1–9</b>, <b>Q–P</b>, <b>A–L</b>, <b>Z–M</b>. <b>Space</b> = random. <b>Esc</b> = tišina.</p>
</header>

<div class="controls">
  <button class="ctl-btn yellow" id="chaos">☠ Panika mode</button>
  <button class="ctl-btn" id="random">🎲 Random</button>
  <button class="ctl-btn danger" id="stop">■ Stop sve</button>
  <label class="vol">Vol <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9"></label>
  <span class="counter">Pumpano <b id="count">0</b> puta</span>
</div>

<main class="board" id="board"></main>

<footer>Sve je <b>lova</b></footer>

<script src="sounds.js"></script>
<script>
(function () {
  const board = document.getElementById('board');
  const countEl = document.getElementById('count');
  const volEl = document.getElementById('vol');
  const KEYS = '1234567890QWERTYUIOPASDFGHJKLZXCVBNM';
  let count = 0;
  try { count = +localStorage.getItem('dsg-count') || 0; } catch (e) {}
  countEl.textContent = count;

  const players = new Map(); // idx -> Audio
  const pads = [];

  SOUNDS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'pad';
    btn.dataset.idx = i;
    btn.innerHTML = `
      <div class="num"><span>#${String(i + 1).padStart(2, '0')}</span><span class="key">${KEYS[i] || ''}</span></div>
      <div class="quote">${s.label}</div>
      <div class="song">${s.song}</div>
      <div class="bar"></div>`;
    btn.addEventListener('click', () => play(i));
    board.appendChild(btn);
    pads.push(btn);

    const a = new Audio('sounds/' + s.file);
    a.preload = 'auto';
    a.addEventListener('timeupdate', () => {
      if (a.duration) btn.querySelector('.bar').style.transform = `scaleX(${a.currentTime / a.duration})`;
    });
    a.addEventListener('ended', () => {
      btn.classList.remove('playing');
      btn.querySelector('.bar').style.transform = 'scaleX(0)';
    });
    players.set(i, a);
  });

  function play(i, opts = {}) {
    const a = players.get(i);
    const btn = pads[i];
    if (!a) return;
    if (!opts.layer) stopAll();
    a.currentTime = 0;
    a.volume = +volEl.value;
    a.play().catch(() => {});
    btn.classList.add('playing');
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    count++; countEl.textContent = count;
    try { localStorage.setItem('dsg-count', count); } catch (e) {}
    flyAdlib(SOUNDS[i].label, btn);
  }

  function stopAll() {
    players.forEach((a, i) => {
      a.pause(); a.currentTime = 0;
      pads[i].classList.remove('playing');
      pads[i].querySelector('.bar').style.transform = 'scaleX(0)';
    });
  }

  function flyAdlib(text, btn) {
    const r = btn.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'adlib';
    el.textContent = text;
    el.style.left = (r.left + r.width / 2) + 'px';
    el.style.top = (r.top) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }

  function randomPlay() { play(Math.floor(Math.random() * SOUNDS.length)); }

  document.getElementById('stop').addEventListener('click', stopAll);
  document.getElementById('random').addEventListener('click', randomPlay);

  // Panika mode: layered chaos
  let chaosTimer = null;
  const chaosBtn = document.getElementById('chaos');
  chaosBtn.addEventListener('click', () => {
    if (chaosTimer) {
      clearInterval(chaosTimer); chaosTimer = null;
      chaosBtn.classList.remove('active'); chaosBtn.textContent = '☠ Panika mode';
      stopAll();
    } else {
      chaosBtn.classList.add('active'); chaosBtn.textContent = '☠ PANIKA PANIKA';
      chaosTimer = setInterval(() => play(Math.floor(Math.random() * SOUNDS.length), { layer: true }), 700);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') { stopAll(); return; }
    if (e.key === ' ') { e.preventDefault(); randomPlay(); return; }
    const idx = KEYS.indexOf(e.key.toUpperCase());
    if (idx > -1 && idx < SOUNDS.length) play(idx, { layer: e.shiftKey });
  });
})();
</script>
</body>
</html>
